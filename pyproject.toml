[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowdesk"
dynamic = ["version"]
description = "Linux-first FlowJo-like flow cytometry analysis application"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Yoshihiko Fujita", email = "yfujita.skgcat@gmail.com" }]
dependencies = [
  "numpy",
  "flowio",
  "Pillow",
]

[project.optional-dependencies]
gui = ["PySide6", "pyqtgraph"]
dev = ["pytest", "ruff", "mypy", "pyinstaller"]
gui-test = ["pytest-qt"]

[project.scripts]
flowdesk = "flowdesk_cli.main:main"
flowdesk-gui = "flowdesk_qt:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "flowdesk_qt._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
  "gui: tests requiring PySide6 or pyqtgraph",
  "gui_e2e: end-to-end tests spanning MainWindow and PipelineRunner",
  "real_fcs: tests using external FCS files under data/",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["flowdesk_core", "flowdesk_storage", "flowdesk_cli"]

[[tool.mypy.overrides]]
module = ["numpy.*"]
ignore_errors = true
