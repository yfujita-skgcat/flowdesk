name: Package macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package-macos:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]"

      - name: Run core tests
        run: python -m pytest -m "not gui"

      - name: Write native platform report
        run: python tools/platform_report.py --output artifacts/platform-report.json

      - name: Build native packages
        run: python tools/package.py build

      - name: Create package smoke fixture
        run: >-
          python tools/create_package_smoke_fixture.py
          --output-dir artifacts/package-fixture

      - name: Run packaged smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python tools/package.py smoke
          --project artifacts/package-fixture/project.flowdesk
          --fcs artifacts/package-fixture/sample.fcs
          --batch-export-id package-smoke-export
          --timeout 300

      - name: Write build manifest
        run: >-
          python tools/package.py manifest
          --output artifacts/package-smoke/build-manifest.json

      - name: Create macOS archive
        run: |
          cd dist
          zip -r ../Flowdesk-macOS-arm64.zip flowdesk flowdesk-cli

      - name: Upload macOS package
        uses: actions/upload-artifact@v5
        with:
          name: Flowdesk-macOS-arm64
          path: |
            Flowdesk-macOS-arm64.zip
            artifacts/package-smoke/
            artifacts/platform-report.json
          if-no-files-found: error
