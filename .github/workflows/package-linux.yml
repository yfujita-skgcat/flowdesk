name: Package Linux

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package-linux:
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]"

      - name: Run core tests
        run: python -m pytest -m "not gui"

      - name: Build native packages
        run: python tools/package.py build

      - name: Run packaged smoke test
        run: >-
          python tools/package.py smoke
          --project data/analysis.flowdesk
          --fcs data/1_A1.fcs
          --batch-export-id batch-export-2c72921e28a9
          --timeout 300

      - name: Write build manifest
        run: >-
          python tools/package.py manifest
          --output artifacts/package-smoke/build-manifest.json

      - name: Create Linux archive
        run: >-
          tar -czf Flowdesk-Linux-x86_64.tar.gz
          -C dist flowdesk flowdesk-cli

      - name: Upload Linux package
        uses: actions/upload-artifact@v5
        with:
          name: Flowdesk-Linux-x86_64
          path: |
            Flowdesk-Linux-x86_64.tar.gz
            artifacts/package-smoke/
          if-no-files-found: error
