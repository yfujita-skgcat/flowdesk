name: Package Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]"

      - name: Run core tests
        shell: pwsh
        run: python -m pytest -m "not gui"

      - name: Run density runtime smoke benchmark
        shell: pwsh
        run: >-
          python tools/benchmark_density_plot.py
          --points 1000000
          --repeats 1
          --density-workers 4
          --density-memory-budget-mib 64
          --output artifacts/density-runtime-benchmark.json

      - name: Run representative batch export smoke
        shell: pwsh
        run: >-
          python -m flowdesk_cli.main batch-plot data/analysis.flowdesk
          --export-id batch-export-2c72921e28a9
          --output-dir artifacts/batch-runtime-smoke
          --density-workers 2
          --density-memory-budget-mib 64

      - name: Build native packages
        shell: pwsh
        run: python tools/package.py build

      - name: Run packaged smoke test
        shell: pwsh
        run: python tools/package.py smoke

      - name: Write build manifest
        shell: pwsh
        run: |
          python tools/package.py manifest `
            --output artifacts/package-smoke/build-manifest.json

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist\flowdesk, dist\flowdesk-cli `
            -DestinationPath Flowdesk-Windows-x64.zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v5
        with:
          name: Flowdesk-Windows-x64
          path: |
            Flowdesk-Windows-x64.zip
            artifacts/package-smoke/
            artifacts/density-runtime-benchmark.json
            artifacts/batch-runtime-smoke/
          if-no-files-found: error
